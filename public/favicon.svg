    <circle cx="32" cy="60" r="2.4"/>
    <circle cx="4" cy="32" r="2.4"/>
    <circle cx="60" cy="32" r="2.4"/>
    <circle cx="11.7" cy="11.7" r="2.4"/>
    <circle cx="52.3" cy="11.7" r="2.4"/>
